name: CI
on:
  # Not on every commit: run by hand when needed, plus once a week.
  workflow_dispatch:
  schedule:
    - cron: '41 1 * * 1'
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        react: [18, 19]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Check minimum supported TypeScript
        if: matrix.node == 22
        run: npm install --no-save --package-lock=false typescript@5.8.3
      - run: npm test
      - run: npm run smoke
        env:
          RQH_TEST_REACT: ${{ matrix.react }}

  site:
    name: Bilingual demo and SEO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:site
      - run: node scripts/check-site.mjs
