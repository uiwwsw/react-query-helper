name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        node: [22, 24]
        react: [18, 19]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Check minimum supported TypeScript
        if: matrix.node == 22
        run: npm install --no-save --package-lock=false typescript@5.8.3
      - run: npm test
      - run: npm run smoke
        env:
          RQH_TEST_REACT: ${{ matrix.react }}
